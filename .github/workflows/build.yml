name: Build Windows Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 步骤 1：自动生成临时 .env，防止因缺失 Asset 导致崩溃
      - name: Create placeholder .env
        run: |
          if (Test-Path .env.example) {
            Copy-Item .env.example .env
          } else {
            New-Item -Path . -Name ".env" -ItemType "file" -Value "NOTION_TOKEN=dummy`nNOTION_DATABASE_ID=dummy"
          }
        shell: powershell

      # 步骤 2：生成可能缺失的代码文件（如果项目没用到会自动跳过）
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      # 步骤 3：使用作者推荐的专用脚本 build.dart 进行打包
      - name: Build Windows
        env:
          BANGUMI_CLIENT_ID: "dummy_client_id"
          BANGUMI_CLIENT_SECRET: "dummy_client_secret"
        run: dart run tool/build.dart --platform windows --release

      # 步骤 4：上传编译完成的 zip 包
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugn_bangumi2notion-windows
          path: build/windows/x64/runner/Release/
