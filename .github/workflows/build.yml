name: Build Windows Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 1. 编译前强制生成根目录 .env 文件
      - name: Create root .env file
        shell: pwsh
        run: |
          @'
          NOTION_TOKEN=
          NOTION_DATABASE_ID=
          '@ | Set-Content -Path .env -Encoding utf8

      # 2. 注入自动代理拦截器（使用数组规避 YAML 缩进报错，彻底告别 TUN 模式）
      - name: Inject Auto-Proxy Patch
        shell: pwsh
        run: |
          $mainPath = "lib/main.dart"
          $patchLines = @(
            "",
            "import 'dart:io';",
            "",
            "class AutoProxyOverrides extends HttpOverrides {",
            "  @override",
            "  HttpClient createHttpClient(SecurityContext? context) {",
            "    final client = super.createHttpClient(context);",
            "    client.badCertificateCallback = (cert, host, port) => true;",
            "    client.findProxy = (uri) {",
            "      var envProxy = HttpClient.findProxyFromEnvironment(uri);",
            "      if (envProxy.isNotEmpty && envProxy != 'DIRECT') {",
            "        return envProxy;",
            "      }",
            "      return 'PROXY 127.0.0.1:10809; PROXY 127.0.0.1:7890; PROXY 127.0.0.1:7897; DIRECT';",
            "    };",
            "    return client;",
            "  }",
            "}"
          )
          Add-Content -Path $mainPath -Value ($patchLines -join "`n") -Encoding utf8
          $content = Get-Content$mainPath -Raw
          $content =$content -replace "void main\(\) async \{", "void main() async {`n  HttpOverrides.global = AutoProxyOverrides();"
          $content = $content -replace "void main\(\) \{", "void main() {`n  HttpOverrides.global = AutoProxyOverrides();"
          Set-Content -Path $mainPath -Value$content -Encoding utf8

      # 3. 构建软件
      - name: Build Windows Release
        env:
          BANGUMI_CLIENT_ID: "你的Bangumi_App_ID"
          BANGUMI_CLIENT_SECRET: "你的Bangumi_App_Secret"
        run: dart run tool/build.dart --platform windows --release

      # 4. 复制 .env 到资源包路径 data/flutter_assets/
      - name: Copy .env to flutter_assets
        shell: pwsh
        run: |
          $targetDir = "build/windows/x64/runner/Release/data/flutter_assets"
          if (!(Test-Path $targetDir)) { New-Item -ItemType Directory -Path$targetDir }
          Copy-Item .env "$targetDir\.env"

      # 5. 上传成品包
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugn_bangumi2notion-windows
          path: build/windows/x64/runner/Release/
