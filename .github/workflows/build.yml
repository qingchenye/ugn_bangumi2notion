name: Build Windows Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 关键步骤：因为 pubspec.yaml 中强制要求了 .env 文件
      # 此步骤会在打包前自动补全 .env，彻底解决资源缺失导致的崩溃问题
      - name: Create required .env file
        run: |
          if (Test-Path .env.example) {
            Copy-Item .env.example .env
          } else {
            Set-Content -Path .env -Value "NOTION_TOKEN=dummy`nNOTION_DATABASE_ID=dummy"
          }
        shell: powershell

      # 直接调用作者写好的 tool/build.dart 脚本进行 Windows 自动化打包与 DLL 补全
      - name: Build Windows Release
        env:
          BANGUMI_CLIENT_ID: "dummy_client_id"
          BANGUMI_CLIENT_SECRET: "dummy_client_secret"
        run: dart run tool/build.dart --platform windows --release

      # 将编译成功、并已补全 VC++ 运行库的完整文件夹打成 zip 包上传
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugn_bangumi2notion-windows
          path: build/windows/x64/runner/Release/
