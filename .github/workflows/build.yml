name: Build Windows Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 自动生成临时 .env，防止因缺失配置文件导致 Flutter 打包资源时报错
      - name: Create placeholder .env
        run: |
          if (Test-Path .env.example) {
            Copy-Item .env.example .env
          } else {
            New-Item -Path . -Name ".env" -ItemType "file" -Value "NOTION_TOKEN=dummy`nNOTION_DATABASE_ID=dummy"
          }
        shell: powershell

      # 使用作者推荐的专用脚本 build.dart 进行 Windows 打包
      - name: Build Windows
        env:
          BANGUMI_CLIENT_ID: "dummy_client_id"
          BANGUMI_CLIENT_SECRET: "dummy_client_secret"
        run: dart run tool/build.dart --platform windows --release

      # 上传编译好的压缩包
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugn_bangumi2notion-windows
          path: build/windows/x64/runner/Release/
