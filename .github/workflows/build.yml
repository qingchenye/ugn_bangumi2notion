name: Build Windows Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 关键修复：使用 PowerShell Core (pwsh) 强制生成标准 UTF-8 编码的 .env 文件
      - name: Create required .env file
        shell: pwsh
        run: |
          if (Test-Path .env.example) {
            Copy-Item .env.example .env
          } else {
            [System.IO.File]::WriteAllText("$PWD\.env", "NOTION_TOKEN=dummy`nNOTION_DATABASE_ID=dummy")
          }

      # 打包 Windows 软件（记得将下面的 ID 和 Secret 替换为你自己在 Bangumi 申请的真实值）
      - name: Build Windows Release
        env:
          BANGUMI_CLIENT_ID: "bgm72826acc4d1ec10db"
          BANGUMI_CLIENT_SECRET: "3fb67a0b1ee0f5802a97c0c59f1ecfac"
        run: dart run tool/build.dart --platform windows --release

      # 上传编译好的软件压缩包
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugn_bangumi2notion-windows
          path: build/windows/x64/runner/Release/
